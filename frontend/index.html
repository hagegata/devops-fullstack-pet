<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>URL Shortener</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 600px;
            margin: 80px auto;
            padding: 0 20px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        input {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background: #0066cc;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #0055aa; }
        #result {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 4px;
            display: none;
        }
        #result a { color: #0066cc; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>URL Shortener</h1>
    <p>Вставь длинную ссылку — получишь короткую.</p>

    <input type="url" id="urlInput" placeholder="https://example.com/very/long/url">
    <button onclick="shorten()">Сократить</button>

    <div id="result"></div>

    <script>
        async function shorten() {
            const input = document.getElementById('urlInput');
            const result = document.getElementById('result');
            const url = input.value.trim();

            if (!url) {
                result.style.display = 'block';
                result.innerHTML = '<span class="error">Введите URL</span>';
                return;
            }

            try {
                const response = await fetch('/api/shorten', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });

                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();
                const shortUrl = window.location.origin + '/' + data.short;

                result.style.display = 'block';
                result.innerHTML = 'Короткая ссылка: <a href="/' + data.short + '" target="_blank">' + shortUrl + '</a>';
            } catch (e) {
                result.style.display = 'block';
                result.innerHTML = '<span class="error">Ошибка: ' + e.message + '</span>';
            }
        }
    </script>
</body>
</html>
